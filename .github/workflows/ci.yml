name: CI

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore SMSGate.sln -warnaserror
      - name: Debug tests
        run: dotnet test SMSGate.sln --configuration Debug --no-restore -warnaserror --logger trx --results-directory TestResults/Debug
      - name: Release tests
        run: dotnet test SMSGate.sln --configuration Release --no-restore -warnaserror --logger trx --results-directory TestResults/Release
      - name: Pack
        run: dotnet pack Smpp/Smpp.csproj --configuration Release --no-build --no-restore -warnaserror --output artifacts
      - name: Restore example from the package
        run: dotnet restore examples/LocalExchange/LocalExchange.csproj --source "$PWD/artifacts" -warnaserror
      - name: Verify local SMPP exchange using the package
        run: dotnet run --project examples/LocalExchange/LocalExchange.csproj --configuration Release --no-restore
      - name: Verify provider features using the package
        run: |
          version=$(dotnet msbuild Smpp/Smpp.csproj -getProperty:Version | tr -d '\r')
          dotnet restore examples/ProviderFeatures/ProviderFeatures.csproj --source "$PWD/artifacts" -p:SMSGateVersion="$version" -warnaserror
          dotnet run --project examples/ProviderFeatures/ProviderFeatures.csproj --configuration Release --no-restore -p:SMSGateVersion="$version"
      - name: Verify hosted service and independent SMPP peer using the package
        shell: bash
        run: |
          version=$(dotnet msbuild Smpp/Smpp.csproj -getProperty:Version | tr -d '\r')
          dotnet restore examples/WorkerService/WorkerService.csproj --source "$PWD/artifacts" -p:SMSGateVersion="$version" -warnaserror
          dotnet run --project examples/WorkerService/WorkerService.csproj --configuration Release --no-restore -p:SMSGateVersion="$version"
          dotnet restore examples/InteropPeer/InteropPeer.csproj --source "$PWD/artifacts" -p:SMSGateVersion="$version" -warnaserror
          dotnet build examples/InteropPeer/InteropPeer.csproj --configuration Release --no-restore -p:SMSGateVersion="$version" -warnaserror
          python scripts/interop.py examples/InteropPeer/bin/Release/net10.0/InteropPeer.dll
      - name: Upload packages and test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-and-test-results-${{ matrix.os }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            TestResults/**/*.trx
          if-no-files-found: error
