name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-publication
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'kirakosyan/smsgate' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_id: ${{ steps.packages.outputs.artifact-id }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify the release tag and source
        id: version
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          version=$(dotnet msbuild Smpp/Smpp.csproj -getProperty:Version)
          test "$GITHUB_REF_NAME" = "v$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Restore
        run: dotnet restore SMSGate.sln -warnaserror
      - name: Debug tests
        run: dotnet test SMSGate.sln --configuration Debug --no-restore -warnaserror
      - name: Release tests
        run: dotnet test SMSGate.sln --configuration Release --no-restore -warnaserror
      - name: Pack
        run: dotnet pack Smpp/Smpp.csproj --configuration Release --no-build --no-restore -warnaserror --output artifacts
      - name: Restore example from the package
        run: dotnet restore examples/LocalExchange/LocalExchange.csproj --source "$PWD/artifacts" -warnaserror
      - name: Verify local SMPP exchange using the package
        run: dotnet run --project examples/LocalExchange/LocalExchange.csproj --configuration Release --no-restore
      - name: Verify provider features using the package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet restore examples/ProviderFeatures/ProviderFeatures.csproj --source "$PWD/artifacts" -p:SMSGateVersion="$PACKAGE_VERSION" -warnaserror
          dotnet run --project examples/ProviderFeatures/ProviderFeatures.csproj --configuration Release --no-restore -p:SMSGateVersion="$PACKAGE_VERSION"
      - name: Verify hosted service and independent SMPP peer using the package
        shell: bash
        run: |
          version=$(dotnet msbuild Smpp/Smpp.csproj -getProperty:Version | tr -d '\r')
          dotnet restore examples/WorkerService/WorkerService.csproj --source "$PWD/artifacts" -p:SMSGateVersion="$version" -warnaserror
          dotnet run --project examples/WorkerService/WorkerService.csproj --configuration Release --no-restore -p:SMSGateVersion="$version"
          dotnet restore examples/InteropPeer/InteropPeer.csproj --source "$PWD/artifacts" -p:SMSGateVersion="$version" -warnaserror
          dotnet build examples/InteropPeer/InteropPeer.csproj --configuration Release --no-restore -p:SMSGateVersion="$version" -warnaserror
          python scripts/interop.py examples/InteropPeer/bin/Release/net10.0/InteropPeer.dll
      - name: Upload release packages
        id: packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Download the validated packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: artifacts
      - name: Get a short-lived NuGet credential
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish package and symbols to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          dotnet nuget push "artifacts/SMSGate.$PACKAGE_VERSION.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --symbol-api-key "$NUGET_API_KEY" --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
              --verify-tag --title "SMSGate $PACKAGE_VERSION" --notes-file CHANGELOG.md
          fi
