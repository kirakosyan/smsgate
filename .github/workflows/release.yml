name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: 'Successful tag validation run to publish; leave empty to validate only'
        type: string
        default: ''
      qualified_package_sha256:
        description: 'Package SHA-256 from actual Framework 4.7.2 qualification'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: nuget-publication
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'kirakosyan/smsgate' && inputs.validation_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_id: ${{ steps.packages.outputs.artifact-id }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify the release tag and source
        id: version
        shell: bash
        run: |
          version=$(dotnet msbuild Smpp/Smpp.csproj -getProperty:Version)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/master
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Restore
        run: dotnet restore SMSGate.sln -warnaserror
      - name: Debug tests
        run: dotnet test SMSGate.sln --framework net10.0 --configuration Debug --no-restore -warnaserror
      - name: Release tests
        run: dotnet test SMSGate.sln --framework net10.0 --configuration Release --no-restore -warnaserror
      - name: Build both package targets
        run: dotnet build Smpp/Smpp.csproj --configuration Release --no-restore -warnaserror
      - name: Restore the API compatibility baseline
        run: dotnet restore Smpp/Smpp.csproj -warnaserror -p:EnablePackageValidation=true -p:PackageValidationBaselineVersion=1.1.1
      - name: Pack
        run: dotnet pack Smpp/Smpp.csproj --configuration Release --no-build --no-restore -warnaserror --output artifacts -p:EnablePackageValidation=true -p:PackageValidationBaselineVersion=1.1.1
      - name: Restore example from the package
        run: dotnet restore examples/LocalExchange/LocalExchange.csproj --source "$PWD/artifacts" -warnaserror
      - name: Verify local SMPP exchange using the package
        run: dotnet run --project examples/LocalExchange/LocalExchange.csproj --configuration Release --no-restore
      - name: Verify provider features using the package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet restore examples/ProviderFeatures/ProviderFeatures.csproj --source "$PWD/artifacts" -p:SMSGateVersion="$PACKAGE_VERSION" -warnaserror
          dotnet run --project examples/ProviderFeatures/ProviderFeatures.csproj --configuration Release --no-restore -p:SMSGateVersion="$PACKAGE_VERSION"
      - name: Verify hosted service and independent SMPP peer using the package
        shell: bash
        run: |
          version=$(dotnet msbuild Smpp/Smpp.csproj -getProperty:Version | tr -d '\r')
          dotnet restore examples/WorkerService/WorkerService.csproj --source "$PWD/artifacts" -p:SMSGateVersion="$version" -warnaserror
          dotnet run --project examples/WorkerService/WorkerService.csproj --configuration Release --no-restore -p:SMSGateVersion="$version"
          dotnet restore examples/InteropPeer/InteropPeer.csproj --source "$PWD/artifacts" -p:SMSGateVersion="$version" -warnaserror
          dotnet build examples/InteropPeer/InteropPeer.csproj --configuration Release --no-restore -p:SMSGateVersion="$version" -warnaserror
          python scripts/interop.py examples/InteropPeer/bin/Release/net10.0/InteropPeer.dll
      - name: Upload release packages
        id: packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  validate-framework:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Framework Debug tests (installed Windows runtime)
        run: dotnet test Smpp.Tests/Smpp.Tests.csproj --framework net472 --configuration Debug -warnaserror --logger trx --results-directory TestResults/Framework-Debug
      - name: Framework Release tests (installed Windows runtime)
        run: dotnet test Smpp.Tests/Smpp.Tests.csproj --framework net472 --configuration Release --no-restore -warnaserror --logger trx --results-directory TestResults/Framework-Release
      - name: Download the canonical release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: artifacts
      - name: Verify the exact package on Framework
        run: |
          $version = '${{ needs.validate.outputs.version }}'
          ./scripts/restore-framework-example.ps1 -PackageDirectory artifacts -Version $version
          dotnet build examples/FrameworkExchange/FrameworkExchange.csproj --configuration Release --no-restore -p:SMSGateVersion=$version -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packageRoot = (Get-Content Smpp.Tests/obj/project.assets.json -Raw | ConvertFrom-Json).packageFolders.PSObject.Properties.Name | Select-Object -First 1
          $runner = Join-Path $packageRoot 'nunit.consolerunner/3.22.0/tools'
          ./scripts/create-framework-bundle.ps1 -Package "artifacts/SMSGate.$version.nupkg" -RunnerDirectory $runner -Destination artifacts/framework-bundle -ExpectedTests 1057
          ./scripts/qualify-framework.ps1 -BundleDirectory artifacts/framework-bundle -ResultsDirectory TestResults/Framework-Package
      - name: Upload Framework runtime reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: framework-test-results
          path: |
            TestResults/
            artifacts/framework-bundle/
          if-no-files-found: error

  publish:
    if: github.repository == 'kirakosyan/smsgate' && github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.validation_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify the qualified validation run
        id: qualified
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          QUALIFIED_PACKAGE_SHA256: ${{ inputs.qualified_package_sha256 }}
        run: ./scripts/verify-release-input.ps1 -RunId $env:VALIDATION_RUN_ID -PackageSha256 $env:QUALIFIED_PACKAGE_SHA256
      - name: Download the validated packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.qualified.outputs.artifact_id }}
          run-id: ${{ inputs.validation_run_id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Verify exact qualified bytes and release metadata
        shell: pwsh
        env:
          QUALIFIED_PACKAGE_SHA256: ${{ inputs.qualified_package_sha256 }}
        run: |
          $version = dotnet msbuild Smpp/Smpp.csproj -getProperty:Version
          if ($LASTEXITCODE -ne 0 -or $env:GITHUB_REF_NAME -ne "v$version") { throw 'Release version/tag mismatch.' }
          if ((Get-FileHash "artifacts/SMSGate.$version.nupkg" -Algorithm SHA256).Hash -ne $env:QUALIFIED_PACKAGE_SHA256) { throw 'Package differs from the minimum-runtime qualified bytes.' }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Get a short-lived NuGet credential
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish package and symbols to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          dotnet nuget push "artifacts/SMSGate.$PACKAGE_VERSION.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --symbol-api-key "$NUGET_API_KEY" --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
              --verify-tag --title "SMSGate $PACKAGE_VERSION" --notes-file CHANGELOG.md
          fi
