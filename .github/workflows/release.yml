name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Match the release tag to the package version
        id: version
        shell: bash
        run: |
          version=$(dotnet msbuild Smpp/Smpp.csproj -getProperty:Version)
          test "$GITHUB_REF_NAME" = "v$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Restore
        run: dotnet restore SMSGate.sln -warnaserror
      - name: Debug tests
        run: dotnet test SMSGate.sln --configuration Debug --no-restore -warnaserror
      - name: Release tests
        run: dotnet test SMSGate.sln --configuration Release --no-restore -warnaserror
      - name: Pack
        run: dotnet pack Smpp/Smpp.csproj --configuration Release --no-build --no-restore -warnaserror --output artifacts
      - name: Restore example from the package
        run: dotnet restore examples/LocalExchange/LocalExchange.csproj --source "$PWD/artifacts" -warnaserror
      - name: Verify local SMPP exchange using the package
        run: dotnet run --project examples/LocalExchange/LocalExchange.csproj --configuration Release --no-restore
      - name: Upload release packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
      - name: Publish package and symbols to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if test -z "$NUGET_API_KEY"; then
            printf 'Configure the NUGET_API_KEY repository secret before publishing.\n' >&2
            exit 1
          fi
          dotnet nuget push "artifacts/SMSGate.$PACKAGE_VERSION.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --symbol-api-key "$NUGET_API_KEY" --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
              --verify-tag --title "SMSGate $PACKAGE_VERSION" --notes-file CHANGELOG.md
          fi
